<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; }
    .layer-label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .node-label { font-size: 12px; font-weight: 500; }
    .node-sub { font-size: 9px; }
    .flow-text { font-size: 10px; letter-spacing: 0.12em; }
    .title { font-size: 14px; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="card-glow-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D97E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D97E" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="card-glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="card-glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="card-glow-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D97E"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <marker id="arrow-down" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#00D97E" opacity="0.6"/>
    </marker>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="580" fill="none" rx="12"/>
  <text x="480" y="24" text-anchor="middle" class="title" fill="url(#grad-text)">EventMesh Architecture</text>
  <rect x="30" y="45" width="900" height="95" rx="10" fill="url(#card-glow-blue)" stroke="rgba(124,92,252,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="50" y="67" class="layer-label" fill="#7C5CFC">Applications</text>
  <rect x="200" y="75" width="120" height="42" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="260" y="101" text-anchor="middle" class="node-label" fill="#A0AAB8">Microservices</text>
  <rect x="350" y="75" width="120" height="42" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="410" y="101" text-anchor="middle" class="node-label" fill="#A0AAB8">Serverless</text>
