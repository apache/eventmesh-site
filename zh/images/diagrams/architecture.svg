  <text x="555" y="349" text-anchor="middle" class="node-sub" fill="rgba(160,170,184,0.5)">core service</text>
  <rect x="670" y="311" width="150" height="48" rx="8" fill="rgba(0,217,126,0.06)" stroke="rgba(0,217,126,0.2)" filter="url(#soft-glow)"/>
