  <text x="600" y="455" text-anchor="middle" class="node-label" fill="#A0AAB8">Redis</text>
  <rect x="700" y="432" width="100" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="750" y="455" text-anchor="middle" class="node-label" fill="#A0AAB8">Pulsar</text>
  <rect x="830" y="432" width="100" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="880" y="455" text-anchor="middle" class="node-label" fill="#A0AAB8">RabbitMQ</text>
