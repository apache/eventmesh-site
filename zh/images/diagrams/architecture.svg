  <text x="430" y="219" text-anchor="middle" class="node-label" fill="#A0AAB8">TCP</text>
  <rect x="510" y="196" width="100" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="560" y="219" text-anchor="middle" class="node-label" fill="#A0AAB8">WebSocket</text>
  <rect x="660" y="196" width="100" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="710" y="219" text-anchor="middle" class="node-label" fill="#A0AAB8">CloudEvents</text>
  <rect x="810" y="196" width="100" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="860" y="219" text-anchor="middle" class="node-label" fill="#A0AAB8">A2A</text>
  <path d="M480,255 L480,277" stroke="#00D97E" stroke-width="1.5" stroke-opacity="0.5" fill="none" marker-end="url(#arrow-down)"/>
  <text x="496" y="269" class="flow-text" fill="rgba(0,217,126,0.5)">EVENT FLOW</text>
